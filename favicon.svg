<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cardinal rays -->
  <rect x="43" y="6"  width="14" height="18" fill="#111111"/>
  <rect x="43" y="76" width="14" height="18" fill="#111111"/>
  <rect x="6"  y="43" width="18" height="14" fill="#111111"/>
  <rect x="76" y="43" width="18" height="14" fill="#111111"/>
  <!-- Diagonal rays -->
  <rect x="-4.5" y="-12" width="9" height="24" transform="translate(76,24) rotate(45)"  fill="#111111"/>
  <rect x="-4.5" y="-12" width="9" height="24" transform="translate(24,24) rotate(-45)" fill="#111111"/>
  <rect x="-4.5" y="-12" width="9" height="24" transform="translate(76,76) rotate(-45)" fill="#111111"/>
  <rect x="-4.5" y="-12" width="9" height="24" transform="translate(24,76) rotate(45)"  fill="#111111"/>
  <!-- Solar disc -->
  <circle cx="50" cy="50" r="21" fill="#E8560C"/>
</svg>
